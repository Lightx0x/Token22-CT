[package]
name = "t22"
version = "0.1.0"
description = "Token-2022 remittance stablecoin: transfer fees, KYC gating, on-chain metadata, seizure, confidential transfers"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "t22"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = { version = "1.2.0", features = ["token_2022", "token_2022_extensions"] }
# Not re-exported by anchor-spl, and both are needed on chain: the metadata
# TLV length for the rent top-up, and `ProofLocation` for the confidential
# instructions anchor-spl ships no CPI helper for.
spl-token-metadata-interface = "0.8"
spl-type-length-value = "0.9"
proofext = { package = "spl-token-confidential-transfer-proof-extraction", version = "0.5" }

[dev-dependencies]
litesvm = "0.10.0"
solana-account = "3"
solana-compute-budget-interface = "3"
solana-keypair = "3.1.2"
solana-message = "3"
solana-signer = "3.0.1"
solana-system-interface = "3.2"
solana-transaction = "3"
solana-clock = "3"
solana-instruction-error = "2"
solana-transaction-error = "3"
solana-instruction = "3"
solana-pubkey = "3"
solana-program-pack = "3"
spl-associated-token-account-interface = "2.0"
# These three must agree with the zk-sdk used by the ZK ElGamal proof program
# that litesvm runs as a builtin, or proofs generated here fail verification
# with `AlgebraicRelation`. litesvm 0.16 pins a builtin on zk-sdk 5, which no
# proof-generation release targets, so this pairs 0.10 with zk-sdk 4.
zk = { package = "solana-zk-sdk", version = "4" }
t22new = { package = "spl-token-2022-interface", version = "2.1" }
proofgen = { package = "spl-token-confidential-transfer-proof-generation", version = "0.5" }
bytemuck = "1"
spl-token-metadata-interface = "0.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
